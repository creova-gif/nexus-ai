name: NexusAI
owner: creova-gif

stack:
  language: ["javascript"]
  framework: ["vite"]

skill_groups:
  default: [engineering, product]
  conditional:
    design: [ui-ux]
    security: [security]

# null = no command detected -> agents must report NOT VERIFIED for that gate
verification:
  install: "pnpm install"
  lint: null
  typecheck: null
  test: "pnpm run test"
  build: "pnpm run build"

integrations:
  github: true
  linear: false   # set true once the Linear connector is authorized

agent_runtime:
  required: false
  preferred: null
